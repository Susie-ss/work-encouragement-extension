<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earnings · Work Encourager</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="page">
    <header class="page-header">
      <div>
        <h1 data-i18n="dash.heading">📊 Earnings</h1>
        <p class="subtitle" id="rangeHint">--</p>
      </div>
      <div class="header-actions">
        <button id="exportBtn" class="btn btn-primary" data-i18n="dash.export">Export CSV</button>
        <button id="settingsBtn" class="btn btn-ghost" data-i18n="dash.settings">⚙ Settings</button>
        <button id="langBtn" class="btn btn-ghost btn-lang" data-i18n-title="btn.lang">EN</button>
      </div>
    </header>

    <section class="stat-row">
      <div class="stat-card">
        <div class="stat-label" data-i18n="stat.today">Earned today</div>
        <div class="stat-value" id="statToday">¥0.00</div>
        <div class="stat-sub" id="statTodaySub">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-label" data-i18n="stat.week">This week</div>
        <div class="stat-value" id="statWeek">¥0.00</div>
        <div class="stat-sub" id="statWeekSub">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-label" data-i18n="stat.month">This month</div>
        <div class="stat-value accent" id="statMonth">¥0.00</div>
        <div class="stat-sub" id="statMonthSub">--</div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2 data-i18n="chart.week">Daily earnings · this week</h2>
        <span class="panel-tip" id="weekTip"></span>
      </div>
      <svg id="weekChart" viewBox="0 0 700 240" role="img" data-i18n-aria="chart.weekAria"></svg>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2 data-i18n="chart.month">Cumulative · this month</h2>
        <span class="panel-tip" id="monthTip"></span>
      </div>
      <svg id="monthChart" viewBox="0 0 700 240" role="img" data-i18n-aria="chart.monthAria"></svg>
    </section>

    <p class="footnote" data-i18n="dash.footnote">
      Amounts are derived live from the salary and hours in Settings.
    </p>
  </div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
