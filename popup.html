<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Encourager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- 顶部动画：驴拉磨 -->
    <div class="mill-band" aria-hidden="true">
      <svg class="mill-scene" viewBox="0 0 340 96" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="millSky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fffdf8"/>
            <stop offset="1" stop-color="#f6ead6"/>
          </linearGradient>
          <linearGradient id="millStone" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#d5cfc6"/>
            <stop offset="0.4" stop-color="#bdb7ad"/>
            <stop offset="1" stop-color="#999287"/>
          </linearGradient>
          <clipPath id="millRollerClip">
            <rect x="215" y="46" width="50" height="42" rx="3"/>
          </clipPath>
        </defs>

        <!-- 背景 -->
        <rect width="340" height="96" fill="url(#millSky)"/>
        <circle cx="42" cy="24" r="12" fill="#fbe2b0" opacity="0.55"/>
        <circle cx="42" cy="24" r="6.5" fill="#f8d492" opacity="0.5"/>

        <!-- 磨盘平台 -->
        <ellipse cx="172" cy="92" rx="152" ry="28" fill="#ecdfc8"/>
        <ellipse cx="172" cy="86" rx="138" ry="22" fill="#f5ecdc"/>
        <ellipse class="orbit" cx="172" cy="86" rx="100" ry="13" fill="none"
                 stroke="#dccbb0" stroke-width="1.4" stroke-dasharray="6 8"/>

        <!-- 石碾与木桩之间的连接臂 -->
        <line x1="204" y1="32" x2="243" y2="43" stroke="#b58356" stroke-width="5" stroke-linecap="round"/>

        <!-- 石碾 -->
        <ellipse cx="240" cy="88" rx="27" ry="5" fill="#000000" opacity="0.10"/>
        <ellipse cx="240" cy="87" rx="21" ry="3.6" fill="#fffcf3"/>
        <g clip-path="url(#millRollerClip)">
          <rect x="215" y="46" width="50" height="42" fill="url(#millStone)"/>
          <g class="roller-stripes">
            <rect x="215" y="46" width="3.5" height="42" fill="#8f887e" opacity="0.42"/>
            <rect x="227" y="46" width="3.5" height="42" fill="#8f887e" opacity="0.42"/>
            <rect x="239" y="46" width="3.5" height="42" fill="#8f887e" opacity="0.42"/>
            <rect x="251" y="46" width="3.5" height="42" fill="#8f887e" opacity="0.42"/>
            <rect x="263" y="46" width="3.5" height="42" fill="#8f887e" opacity="0.42"/>
          </g>
        </g>
        <ellipse cx="240" cy="46" rx="25" ry="7.5" fill="#dcd7ce" stroke="#c3bdb2" stroke-width="1"/>
        <g class="roller-top">
          <line x1="240" y1="46" x2="250" y2="43" stroke="#b7b1a6" stroke-width="2" stroke-linecap="round"/>
          <circle cx="250.5" cy="42.8" r="1.7" fill="#a9a298"/>
        </g>
        <ellipse cx="240" cy="46" rx="5" ry="1.8" fill="#b7b1a6"/>

        <!-- 拉杆：从肩部伸向木桩 -->
        <line x1="132" y1="43" x2="200" y2="32" stroke="#b58356" stroke-width="6" stroke-linecap="round"/>

        <!-- 中心木桩 -->
        <rect x="196" y="26" width="9" height="62" rx="3" fill="#b58356"/>
        <ellipse cx="200.5" cy="26" rx="4.5" ry="2.4" fill="#c99a6d"/>

        <!-- 驴 -->
        <g class="donkey">
          <!-- 远侧腿 -->
          <g class="leg leg-b-far">
            <rect x="73" y="62" width="6.5" height="26" rx="3.2" fill="#a87a56"/>
            <rect x="73" y="82" width="6.5" height="6" rx="2.6" fill="#5e4030"/>
          </g>
          <g class="leg leg-f-far">
            <rect x="107" y="62" width="6.5" height="26" rx="3.2" fill="#a87a56"/>
            <rect x="107" y="82" width="6.5" height="6" rx="2.6" fill="#5e4030"/>
          </g>

          <!-- 尾巴 -->
          <path class="tail" d="M63,40 Q52,44 50,56" stroke="#7c5334" stroke-width="4"
                fill="none" stroke-linecap="round"/>
          <circle cx="49.6" cy="58" r="3" fill="#7c5334"/>

          <!-- 身体 -->
          <rect x="62" y="38" width="62" height="28" rx="14" fill="#c1885c"/>
          <ellipse cx="86" cy="53" rx="17" ry="8" fill="#d09a6c" opacity="0.5"/>

          <!-- 脖子 -->
          <path d="M122,46 Q131,30 140,27" stroke="#c1885c" stroke-width="12"
                fill="none" stroke-linecap="round"/>
          <!-- 鬃毛 -->
          <path d="M120,40 Q128,27 140,24" stroke="#8a5c39" stroke-width="4"
                fill="none" stroke-linecap="round"/>

          <!-- 头 -->
          <ellipse cx="154" cy="23" rx="14" ry="8.5" fill="#c1885c" transform="rotate(9 154 23)"/>
          <ellipse cx="166.5" cy="27.5" rx="5.8" ry="4.8" fill="#d9a87f"/>
          <rect x="144" y="2.5" width="6.5" height="16" rx="3.2" fill="#a87a56" transform="rotate(-13 147 18.5)"/>
          <rect x="150" y="4" width="7" height="15" rx="3.5" fill="#c1885c" transform="rotate(-2 153 19)"/>
          <rect x="151.8" y="6.5" width="3.4" height="8" rx="1.7" fill="#d9a87f" opacity="0.7" transform="rotate(-2 153 19)"/>
          <circle cx="151" cy="22" r="1.8" fill="#402c20"/>
          <circle cx="151.6" cy="21.5" r="0.55" fill="#fff" opacity="0.8"/>
          <path d="M160,31 q3.5,1 6.5,0" stroke="#b0805b" stroke-width="1.1" fill="none" stroke-linecap="round"/>

          <!-- 脖圈（挂在拉杆上） -->
          <line x1="126" y1="46" x2="136" y2="34" stroke="#8a5c39" stroke-width="6" stroke-linecap="round"/>

          <!-- 近侧腿 -->
          <g class="leg leg-b-near">
            <rect x="82" y="62" width="6.5" height="26" rx="3.2" fill="#c1885c"/>
            <rect x="82" y="82" width="6.5" height="6" rx="2.6" fill="#6b4a33"/>
          </g>
          <g class="leg leg-f-near">
            <rect x="116" y="62" width="6.5" height="26" rx="3.2" fill="#c1885c"/>
            <rect x="116" y="82" width="6.5" height="6" rx="2.6" fill="#6b4a33"/>
          </g>
        </g>

        <!-- 蹄下扬尘 -->
        <circle class="puff puff-1" cx="64" cy="86" r="4" fill="#e2d3ba"/>
        <circle class="puff puff-2" cx="78" cy="88" r="3.4" fill="#e2d3ba"/>
        <circle class="puff puff-3" cx="52" cy="84" r="3" fill="#e2d3ba"/>
      </svg>
    </div>

    <!-- 顶部：日期 + 状态 -->
    <header class="header">
      <div class="date-section">
        <div class="date-label" data-i18n="date.today">Today is</div>
        <div id="currentDate" class="date-value">--</div>
        <div id="weekday" class="weekday"></div>
      </div>
      <div class="status-section">
        <div id="workStatus" class="status-badge">…</div>
        <div id="statusMessage" class="status-message"></div>
      </div>
    </header>

    <main class="main">
      <!-- 今日已赚 -->
      <div class="salary-card">
        <div class="salary-label" data-i18n="salary.label">Earned today</div>
        <div class="salary-amount" id="earnedSalary">¥0.00</div>
        <div class="salary-subtitle" id="salaryRateHint"></div>
      </div>

      <!-- 已工作 / 距下班 -->
      <div class="dual-row">
        <div class="mini-card">
          <div class="mini-label" data-i18n="worked.label">Worked</div>
          <div class="mini-value mono" id="workTimer">00:00:00</div>
        </div>
        <div class="mini-card">
          <div class="mini-label" id="countdownLabel" data-i18n="cd.toOff">Until off</div>
          <div class="mini-value mono accent" id="countdown">00:00:00</div>
        </div>
      </div>

      <!-- 今日进度 -->
      <div class="progress-strip">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <div class="progress-text" id="progressText">0%</div>
      </div>

      <!-- 激励语录 -->
      <div class="quote-card">
        <div id="quoteText" class="quote-text">…</div>
      </div>
    </main>

    <footer class="footer">
      <button id="statsBtn" class="btn btn-primary" data-i18n="btn.stats">Stats</button>
      <button id="settingsBtn" class="btn btn-secondary" data-i18n="btn.settings">Settings</button>
      <button id="langBtn" class="btn btn-secondary btn-lang" data-i18n-title="btn.lang">EN</button>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
